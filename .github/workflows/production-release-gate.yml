name: Production release gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-release-gate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-20-release-gate:
    name: Node 20 release gate
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci
        env:
          RENDER: "true"

      - name: Validate SQLite GLIBC compatibility
        shell: bash
        run: |
          binary="node_modules/sqlite3/build/Release/node_sqlite3.node"
          test -f "$binary"
          ldd --version | head -n 1
          required_glibc="$(objdump -T "$binary" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/^GLIBC_//' | sort -Vu | tail -n 1)"
          test -n "$required_glibc"
          echo "Maximum required GLIBC: $required_glibc"
          dpkg --compare-versions "$required_glibc" le "2.35"

      - name: Validate runtime
        run: npm run check:runtime

      - name: Validate production dependency security
        run: npm run test:security:production

      - name: Validate native SQLite installation
        run: npm run test:sqlite:native

      - name: Validate SQLite runtime compatibility
        run: npm run test:sqlite:runtime

      - name: Validate Resident Evil 5 V2 contracts
        run: npm run test:re5:v2:contracts

      - name: Validate Resident Evil 5 baseline
        run: npm run test:re5:v2:baseline

      - name: Audit Resident Evil 5 release
        run: npm run audit:re5:v2:release

      - name: Build
        run: npm run build --if-present
